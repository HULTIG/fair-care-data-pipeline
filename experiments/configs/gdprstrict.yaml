anonymization:
  epsilon: 0.5
  k: 10
  l: 3
  quasi_identifiers:
  - age
  - location
  - occupation
  - education
  technique: kanonymity
bias_mitigation: true
causal_validation: true
compliance:
  data_minimization: true
  purpose_limitation: true
  regulation: GDPR
  right_to_erasure: true
fairness:
  metrics:
  - Statistical Parity Difference
  - Equal Opportunity Difference
  - Disparate Impact
  thresholds:
    disparate_impact: 0.9
    equal_opportunity_difference: 0.05
    statistical_parity_difference: 0.05
pii_detection:
  confidence_threshold: 0.95
  entities:
  - PERSON
  - GPE
  - ORG
  - email
  - phone
  - ssn
  - DATE_TIME
  - LOCATION
  remove_on_detection: true
  techniques:
  - regex
  - nlp
privacy:
  key_separation: true
  max_reidentification_risk: 0.05
  require_pseudonymization: true
weights:
  bronze: 0.3333
  gold: 0.3334
  silver: 0.3333
